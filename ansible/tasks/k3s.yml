---
- name: Atualiza cache e instala pacotes básicos
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
      - snapd
      - python3
      - python3-pip
      - git
      - vim
    update_cache: yes
    state: present

- name: Adiciona chave GPG do Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Adiciona repositório do Docker
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
    state: present

- name: Instala Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    update_cache: yes
    state: present

- name: Cria diretório de configuração do containerd
  file:
    path: /etc/docker
    state: directory

- name: Copia daemon.json do Docker
  copy:
    src: files/daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'

- name: Reinicia Docker
  service:
    name: docker
    state: restarted
    enabled: yes

- name: Cria diretório de instalação do K3s
  file:
    path: /usr/local/bin
    state: directory
    mode: '0755'

- name: Instala o K3s como servidor
  shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik" sh -
  args:
    creates: /etc/systemd/system/k3s.service

