- name: Aplica o ingress-nginx
  shell: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.1.2/deploy/static/provider/cloud/deploy.yaml

- name: Copia ingress-nginx.yaml adicional
  copy:
    src: files/ingress-nginx.yaml
    dest: /root/
    mode: '0644'

- name: Aplica ingress-nginx.yaml
  command: kubectl apply -f /root/ingress-nginx.yaml

- name: Cria diretório de homolog
  file:
    path: /root/homolog
    state: directory
    mode: '0755'

- name: Copia manifestos da homologação
  copy:
    src: manifestos/homolog/
    dest: /root/homolog/
    mode: '0644'
